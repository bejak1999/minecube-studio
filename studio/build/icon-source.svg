<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background: soft rounded square, near-black to match the app chrome -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="#0b1220"/>

  <g filter="url(#glow)">
    <!-- top face -->
    <polygon points="256,96 396,166 256,236 116,166" fill="url(#top)"/>
    <!-- left face -->
    <polygon points="256,236 116,166 116,336 256,406" fill="url(#left)"/>
    <!-- right face -->
    <polygon points="256,236 396,166 396,336 256,406" fill="url(#right)"/>
  </g>

  <!-- crisp edge highlights -->
  <g fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linejoin="round" opacity="0.55">
    <polygon points="256,96 396,166 256,236 116,166"/>
    <polygon points="256,236 116,166 116,336 256,406"/>
    <polygon points="256,236 396,166 396,336 256,406"/>
  </g>
</svg>
